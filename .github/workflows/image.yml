---
# Merge-is-deploy: elke push naar main bouwt `sha-<short>`, verifieert dat de tag
# echt pullbaar is, en commit die tag terug in deploy/kustomization.yaml. Argo pakt
# het daarna op. Niets te taggen, niets te bumpen, geen tweede PR.
#
# De volgorde is niet vrij: BOUWEN EN VERIFIËREN, DAN BUMPEN. Een tag zetten die
# nog niet bestaat richt Argo op een niet-pullbaar image. Een eerdere variant
# hiervan bij openwoo liet een mens taggen en een follow-up-PR openen; dat voegde
# geen veiligheid toe en één ordeningsfout om te maken.
#
# LET OP (sec-bevinding 3, taak 3.5): deze workflow commit naar main. Zolang main
# onbeschermd is, kan een compromis hier de gedeployde tag verleggen. De
# branch-bescherming is de tegenmaatregel en staat nog open.
name: image

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag om te publiceren (release-marker, verandert de rollout niet)"
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bepaal tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/conductionnl/iso-audit:${{ steps.meta.outputs.tag }}
            ${{ inputs.tag && format('ghcr.io/conductionnl/iso-audit:{0}', inputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifieer dat de tag pullbaar is
        run: |
          set -euo pipefail
          tag="ghcr.io/conductionnl/iso-audit:${{ steps.meta.outputs.tag }}"
          if ! docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            echo "error: ${tag} is niet pullbaar. Staat de ghcr-package op public?" >&2
            echo "Een 401 leest hier als 'nog private', niet als 'tag ontbreekt'." >&2
            exit 1
          fi

      - name: Bump de tag in kustomization.yaml
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          sed -i -E "s|^(    newTag: ).*|\1\"${tag}\"|" deploy/kustomization.yaml
          if git diff --quiet deploy/kustomization.yaml; then
            echo "tag stond al goed; niets te committen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          git commit -m "chore(image): rollout ${tag} [skip ci]"
          # Faalt dit door branch-bescherming, dan bestaat het image wél en staat
          # alleen de rollout stil. Dat is de veilige kant van deze fout.
          git push
