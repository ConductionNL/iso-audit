# ISO 27001:2022 clausule-mapping
# 27 managementclausules (hoofdstuk 4-10) + 93 maatregelen uit Bijlage A (A.5-A.8)
#
# De A-prefix volgt de norm zelf en lost een botsing op: 5.1 is "Leiderschap en betrokkenheid",
# A.5.1 is "Beleid voor informatiebeveiliging". Tot 2026-08-28 bevatte dit bestand alleen
# Bijlage A, waardoor hoofdstuk 4 t/m 10 nooit werd getoetst — de helft van de eis.
# Pas zoektermen aan op organisatie-specifieke terminologie

