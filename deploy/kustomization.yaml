apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iso-platform

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - rbac-config.yaml
  # secret.example.yaml is een TEMPLATE — de echte Secrets out-of-band aanmaken.
  # Bewust NIET in resources: dan zou Argo placeholders over echte secrets heen
  # syncen.
  #
  # rbac-config.yaml geeft get+patch op PRECIES ÉÉN Secret-naam (de UI-configuratie).
  # Namespace-scoped Role, geen ClusterRole, geen `list` — zonder resourceNames zou de
  # pod élk Secret in de namespace mogen lezen, inclusief de bron-credentials.
  #
  # Geen networkpolicy-egress: het openwoo-origineel staat sinds 2026-07-13
  # uitgeschakeld wegens DNS-breuk onder Gardener/Calico. Zie networkpolicy.yaml.

# De oauth2-proxy-config wordt een gehashte ConfigMap, zodat een edit de pod rolt.
# Kustomize herschrijft de volume-referentie in deployment.yaml naar de hash-naam.
configMapGenerator:
  - name: oauth2-proxy-cfg
    files:
      - oauth2-proxy.cfg

# De image-tag wordt met de hand gezet, in dezelfde PR als de wijziging, en MOET
# gelijk zijn aan `version` in pyproject.toml. `.github/workflows/image.yml`
# controleert dat en faalt met een leesbare melding als de twee uiteenlopen.
#
# Waarom niet automatisch: de workflow committe deze tag eerder zelf terug naar
# main. Dat maakte branch-bescherming onmogelijk zonder uitzondering voor de bot,
# en een gecompromitteerde workflow-stap kon zo de gedeployde tag verleggen. De
# workflow heeft nu geen schrijfrechten meer op de repo.
#
# De ordening klopt vanzelf: het image wordt op de PR gebouwd en gepusht, dus de
# tag bestaat vóór de merge en Argo vindt hem direct.
#
# LET OP — dat geldt alléén bij een PR-flow. De Argo-Application staat op `automated`
# met `selfHeal: true` en synct op de commit, niet op `rollout-portal.sh`. Bump je deze
# tag in een directe push naar `main`, dan zet Argo de deployment op een image dat nog
# gebouwd moet worden en valt het portaal om met `ImagePullBackOff`. Gebeurd op
# 2026-08-17, 45 minuten uit de lucht; zie de CHANGELOG. Dus: via een PR, of het image
# eerst publiceren en pas daarna deze regel wijzigen.
images:
  - name: ghcr.io/conductionnl/iso-audit
    newTag: "0.2.0a72"
