# Argo synct de nieuwe tag zodra de commit op main staat, maar het image wordt pas daarna
# gebouwd. Op 2026-08-26 duurde die build elf minuten (wachttijd op een GitHub-runner, de
# testjob zelf deed 1m43), en omdat de Deployment `Recreate` gebruikt — verplicht bij een
# RWO-volume — was de oude pod al weg. Resultaat: negen minuten ImagePullBackOff met een
# portaal dat eruit lag.
#
# Deze Job is een PreSync-hook die niets doet behalve bestaan. Zijn container is precies het
# image dat straks uitgerold wordt; kustomize herschrijft de tag mee. Kan de kubelet dat image
# niet pullen, dan blijft de pod hangen, blijft de hook onvoltooid, wacht Argo met de sync —
# en blijft de oude pod gewoon draaien. Zodra het image verschijnt, draait `true`, is de hook
# klaar en gaat de uitrol verder.
#
# Bewust geen skopeo/crane en geen registry-credentials: de kubelet-pull ís de controle. Dat
# scheelt een extra tool in de keten en het test exact wat de echte pod straks ook doet.
#
# Dit haalt het venster niet weg — dat doet de PR-route, waar het image al tijdens de PR
# gebouwd wordt (`.github/workflows/image.yml` draait ook op `pull_request`). Dit voorkomt dat
# een directe push naar main het portaal onderuit haalt.
apiVersion: batch/v1
kind: Job
metadata:
  name: iso-audit-image-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # BeforeHookCreation en niet HookSucceeded: de vorige Job blijft staan tot de volgende
    # sync, zodat je achteraf kunt zien of een uitrol op het image heeft staan wachten.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Een niet-pullbaar image laat de pod in ImagePullBackOff staan; dat telt niet als een
  # mislukte poging, dus `backoffLimit` is hier niet de grens. `activeDeadlineSeconds` wel:
  # na twintig minuten faalt de sync zichtbaar in plaats van eindeloos te wachten. Twintig
  # minuten is ruim boven de elf van 2026-08-26 en ruim onder een werkdag.
  backoffLimit: 2
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-audit-image-gate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: gate
          # Kustomize herschrijft deze tag via de `images:`-transformer in kustomization.yaml,
          # dus hij loopt per definitie gelijk met wat de Deployment straks pullt.
          image: ghcr.io/conductionnl/iso-audit
          command: ["/bin/true"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
