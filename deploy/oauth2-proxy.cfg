# oauth2-proxy config — authenticeert auditors voor het iso-audit-portaal.
#
# Keycloak (realm "commonground") is de OIDC-provider; Google wordt BINNEN Keycloak
# gebrokerd, zodat deze proxy alleen OIDC met Keycloak spreekt (één integratie om te
# auditen, niet twee). De proxy is de ENIGE ingang naar de app (upstream op
# localhost); de app faalt gesloten (REQUIRE_AUTH) als er ooit een request aankomt
# zonder de identity-header die deze proxy zet.
#
# Overgenomen van openwoo-app-config/webgui/deploy/oauth2-proxy.cfg. Afwijkingen
# staan hieronder expliciet gemarkeerd.
#
# Secrets staan NOOIT in dit bestand — ze komen uit de omgeving:
#   OAUTH2_PROXY_CLIENT_SECRET   het Keycloak-clientsecret van "iso-audit-portal"
#   OAUTH2_PROXY_COOKIE_SECRET   32 bytes random, base64 (openssl rand -base64 32)

provider        = "keycloak-oidc"
oidc_issuer_url = "https://iam.commonground.nu/realms/commonground"
client_id       = "iso-audit-portal"
redirect_url    = "https://iso.commonground.nu/oauth2/callback"

# Reverse-proxy-modus: auth hier afhandelen, doorsturen naar de app op localhost.
# reverse_proxy=true zodat X-Forwarded-Proto van de Ingress gerespecteerd wordt.
http_address  = "0.0.0.0:4180"
upstreams     = ["http://127.0.0.1:8081/"]
reverse_proxy = true

# AFWIJKING van openwoo (300s): een classificatie-run over een Drive-map duurt
# minuten en /run/progress polt ondertussen. 1800s sluit aan op de
# proxy-read-timeout in ingress.yaml; korter kapte de run af met een 502.
upstream_timeout = "1800s"

# Stuur de geauthenticeerde identiteit door als X-Forwarded-Email /
# X-Forwarded-User — precies wat iso_audit.api.auth_gate leest. Geen tokens
# doorsturen: de app heeft alleen de identiteit nodig, niet het access-token.
pass_user_headers         = true
pass_access_token         = false
pass_authorization_header = false

# Alleen de identiteit in de cookie. Id/access/refresh-tokens erin duwden hem bij
# openwoo over de 4kb-grens (split cookies → oversized Cookie-header → 502).
session_cookie_minimal    = true

# Wie mag inloggen. LET OP: dit is de grove poort. Fijnmaziger via de bestaande
# `groups`-scope in de realm is mogelijk maar vraagt een groep-naar-rol-mapping in
# het portaal — eigen change, zie design.md.
email_domains = ["conduction.nl"]

# Geen skip_auth_routes. /healthz heeft het niet nodig: die route wordt door de
# kubelet rechtstreeks op de app-poort geprobed, niet via de proxy.

# Session-cookie hardening. SameSite=lax sluit cross-site POST-CSRF: de
# sessie-cookie gaat niet mee op een cross-site form-POST, dus een vervalste
# triage-submit wordt bij de proxy geweigerd.
cookie_secure    = true
cookie_samesite  = "lax"
# 8h — vastgesteld 2026-08-12, gelijk aan openwoo. Eén werkdag, zodat een auditor
# niet midden in een triage-sessie opnieuw moet inloggen.
#
# RESTRISICO, bewust aanvaard: de cookie draagt de identiteit zelf
# (session_cookie_minimal), dus het uitzetten van een Keycloak-account maakt een al
# uitgegeven cookie NIET ongeldig. Een offboarde auditor komt daarmee tot 8 uur nog
# binnen. Beëindig daarom bij offboarding óók de actieve sessies in de realm — zie
# docs/how-to/verify-portal-auth.md.
cookie_expire    = "8h"

# false → oauth2-proxy toont zijn eigen sign-in-pagina in plaats van stil door te
# leiden naar Keycloak. Bewust: een zichtbare logout/login is auditeerbaar.
skip_provider_button = false

# Sta de post-sign_out-redirect naar Keycloaks end-session-endpoint toe
# (RP-initiated logout). Zonder dit wordt /oauth2/sign_out?rd=<keycloak> geweigerd.
whitelist_domains = ["iam.commonground.nu"]
