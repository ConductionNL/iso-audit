---
# Eén pod, twee containers. De app bindt UITSLUITEND localhost; oauth2-proxy is de
# enige netwerk-listener. Samen met networkpolicy.yaml (ingress alleen uit
# ingress-nginx) is dat het trust-anker onder X-Forwarded-Email — code en manifest,
# geen proza. Zie docs/explanation/portal-auth.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iso-audit-portal
  namespace: iso-platform
  labels:
    app.kubernetes.io/name: iso-audit-portal
    app.kubernetes.io/part-of: iso-platform
spec:
  # Eén replica, en dat is nog steeds geen tijdelijke keuze. Het portaal kent sinds
  # change portal-dashboard wél meerdere audits, maar twee redenen blijven: de PVC is
  # ReadWriteOnce, en de voortgang van een lopende run leeft in het geheugen van het
  # proces (zie api/deps.py). Opschalen vraagt dus eerst run-status op schijf en een
  # RWX-volume.
  replicas: 1
  strategy:
    # Recreate i.p.v. RollingUpdate: bij RWO kan de nieuwe pod het volume niet
    # mounten zolang de oude het vasthoudt, dus een rolling update blijft hangen.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iso-audit-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-audit-portal
    spec:
      serviceAccountName: iso-audit-portal
      securityContext:
        runAsNonRoot: true
        # Expliciet numeriek. Zonder dit leunt de kubelet op de USER uit het image;
        # is die een naam in plaats van een uid, dan weigert hij de container met
        # "cannot verify user is non-root". Het image zet nu ook `USER 10001:10001`,
        # maar dat hier herhalen maakt het manifest onafhankelijk van de image-inhoud
        # — en dit is exact de fout die de eerste rollout omduwde (2026-08-12).
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001          # zodat de non-root app op de PVC mag schrijven
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Zet de audits-root en het profiel klaar als die er nog niet zijn.
        #
        # Sinds change portal-dashboard hoeft er GEEN lege sessie meer te staan: het
        # portaal start op een lege audits-root en de auditor maakt zelf een audit
        # aan. Daarmee is de spanning weg die de eerste rollout omduwde — de app
        # weigerde te starten zonder findings.json, en die stond er niet.
        #
        # Idempotent: bestaande bestanden worden nooit overschreven, dus echte
        # auditdata op de PVC blijft ongemoeid.
        - name: seed-audits
          image: ghcr.io/conductionnl/iso-audit:latest  # override via kustomize images:
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /var/lib/iso-audit/audits
              # Profielmap voor de Anthropic-CLI. De app draait non-root; die map hier
              # aanmaken is betrouwbaarder dan hopen dat fsGroup het toelaat op de
              # volume-root. 700 omdat er een credential in komt te staan.
              mkdir -p /var/lib/iso-audit/anthropic
              chmod 700 /var/lib/iso-audit/anthropic
              [ -f /var/lib/iso-audit/conduction.profile.yaml ] || \
                cp /app/examples/auditmemo/conduction.profile.yaml /var/lib/iso-audit/
              echo "audits-root gereed:"
              ls -la /var/lib/iso-audit /var/lib/iso-audit/audits
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/iso-audit
      containers:
        # De FastAPI-app: uvicorn op 127.0.0.1:8081. NIET op het pod-netwerk —
        # alleen de oauth2-proxy-sidecar (zelfde netns) kan hem bereiken. Die
        # localhost-bind is wat X-Forwarded-Email betrouwbaar maakt.
        - name: app
          image: ghcr.io/conductionnl/iso-audit:latest  # override via kustomize images:
          # `iso-audit ui` heeft geen env-fallbacks: --audits, --profile en --norms
          # zijn alle drie verplicht. Dat is de expliciete-config-discipline van de
          # repo en die houden we hier vast: de paden staan zichtbaar in het manifest,
          # niet verstopt in een image-default.
          # --host 127.0.0.1 is essentieel: de app mag niet op het pod-netwerk
          # luisteren, want dat is het trust-anker onder X-Forwarded-Email.
          args:
            - "ui"
            # `--session` en `--memo-input` zijn vervallen (change portal-dashboard):
            # het portaal kent nu meerdere audits, elk met eigen memo-input in hun
            # directory. Eén globale sessie-vlag zou daar tegen werken.
            - "--audits=/var/lib/iso-audit/audits"
            - "--profile=/var/lib/iso-audit/conduction.profile.yaml"
            - "--norms=/app/examples/norms"
            - "--host=127.0.0.1"
            - "--port=8081"
          env:
            - name: REQUIRE_AUTH
              value: "true"
            # Audit-trail en rapporten op de PVC. Zonder deze vallen ze terug op
            # paden binnen het image — dat faalt onder readOnlyRootFilesystem, en
            # zou anders auditbewijs op een vluchtig filesystem zetten.
            - name: AUDIT_DB_PATH
              value: /var/lib/iso-audit/audit.db
            - name: LOCAL_REPORT_DIR
              value: /var/lib/iso-audit/rapporten
            # Optioneel: een beheerder kan de bron-catalogus (welke velden een auditor
            # per bron invult) overrulen met een YAML. Niet gezet = de ingebouwde
            # standaard, zodat het portaal uit de doos werkt.
            # Genereren: ./scripts/genereer-bron-catalogus.sh
            - name: ISO_AUDIT_BRON_CATALOGUS
              value: /var/lib/iso-audit/bronnen.yaml
            # Profiel van de Anthropic-CLI op de PVC, zodat een `sso`-login een
            # pod-restart overleeft. Zonder dit staat het profiel in de container en is
            # de auditor na elke herstart weer uitgelogd.
            - name: ANTHROPIC_CONFIG_DIR
              value: /var/lib/iso-audit/anthropic
            # Optioneel pad naar een config.yaml met niet-geheime defaults. Precedence:
            # omgeving > config.yaml > UI. Niet gezet = alleen omgeving en UI.
            - name: ISO_AUDIT_CONFIG
              value: /var/lib/iso-audit/config.yaml
            # Zet de Secret-backend voor UI-configuratie aan. Niet gezet = alleen de
            # JSON op de PVC. De rechten staan in rbac-config.yaml: get+patch op precies
            # deze naam, geen list, geen ClusterRole.
            - name: ISO_AUDIT_CONFIG_SECRET
              value: iso-audit-portal-config
            # Waar de browser heen gaat ná het wissen van de proxy-sessie, zodat
            # uitloggen ook echt uitloggen is en een volgende login niet stil
            # doorloopt op de bestaande Keycloak-sessie. `client_id` is verplicht:
            # zonder dat negeert Keycloak de post_logout_redirect_uri.
            # Per omgeving instelbaar — een andere partij heeft een andere provider.
            - name: ISO_AUDIT_LOGOUT_URL
              value: >-
                https://iam.commonground.nu/realms/commonground/protocol/openid-connect/logout?client_id=iso-audit-portal&post_logout_redirect_uri=https%3A%2F%2Fiso.commonground.nu%2F
            # Google Workspace via het org-service-account (change
            # gsuite-service-account-sources). Tot die change draait het portaal
            # zonder Drive/Planning-bron; de healthcheck meldt ze als
            # niet-gekoppeld in plaats van te crashen.
            - name: GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE
              value: /etc/iso-audit/google/service-account.json
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iso-audit-portal-llm
                  key: api-key
                  optional: true
            # Bron-credentials. `optional: true` op alle: een ontbrekende bron moet
            # de healthcheck rood maken, niet de pod in CrashLoopBackOff duwen.
            - name: JIRA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: iso-audit-portal-sources
                  key: jira-base-url
                  optional: true
            - name: JIRA_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: iso-audit-portal-sources
                  key: jira-user-email
                  optional: true
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iso-audit-portal-sources
                  key: jira-api-token
                  optional: true
            - name: MIRO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iso-audit-portal-sources
                  key: miro-api-token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              # 1Gi: WeasyPrint houdt bij het renderen van de memo de hele
              # pagina-boom in geheugen. 512Mi was bij openwoo al te krap voor
              # zwaarder werk.
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/iso-audit
            - name: tmp
              mountPath: /tmp
            - name: google-creds
              mountPath: /etc/iso-audit/google
              readOnly: true
            # Serviceaccount-token, ALLEEN hier. De SA houdt
            # automountServiceAccountToken: false, zodat de oauth2-proxy-sidecar geen
            # token krijgt: die heeft er niets te zoeken bij de kube-API. Het pad is het
            # standaardpad, zodat de kube-client hem zonder configuratie vindt.
            - name: kube-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        # De auth-voorkant: de ENIGE netwerk-listener. Valideert de auditor tegen
        # Keycloak (dat Google brokert) en stuurt de identiteit als
        # X-Forwarded-Email door naar de app op localhost.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - "--config=/etc/oauth2-proxy/oauth2-proxy.cfg"
            # Verifieer de audience tegen `azp` in plaats van `aud`.
            #
            # Keycloak zet deze client niet als `aud` in het token — er staat alleen
            # `azp: iso-audit-portal`. Zonder deze vlag faalt de callback met
            # "audience claims [aud] do not exist in claims" en krijgt de gebruiker
            # een 500 ná een geslaagde login (gemeten 2026-08-12).
            #
            # De gangbare remedie is een `oidc-audience-mapper` in Keycloak. Bewust
            # NIET gekozen: die mapper leeft dan in de Keycloak-UI en niet in Git, en
            # dat is precies de onzichtbare drift die in deze opstelling al drie keer
            # is opgetreden (de clients zelf, de Google-IdP, en deze mapper bij
            # openwoo-provisioner). Deze vlag staat in een manifest dat Argo synct,
            # dus de fix is reviewbaar en reproduceerbaar.
            #
            # Semantisch klopt het: `azp` is de client waaraan het token is uitgegeven,
            # en oauth2-proxy vergelijkt de claim met zijn eigen client_id. De check
            # blijft dus "is dit token voor mij bedoeld" — alleen via de claim die
            # Keycloak hier daadwerkelijk levert.
            - "--oidc-audience-claim=azp"
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iso-audit-portal-oauth
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: iso-audit-portal-oauth
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # Probes op de proxy zelf (/ping). De app-probe hieronder gaat
          # rechtstreeks naar :8081/healthz binnen de pod — die route staat buiten
          # de identity-gate, precies zodat dit werkt zonder sessie.
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: oauth2-cfg
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        # Kortlevend, per pod uitgegeven token met een expliciete audience. Een projected
        # token verloopt en wordt geroteerd; het legacy Secret-token deed dat niet.
        - name: kube-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: https://kubernetes.default.svc
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - fieldRef:
                  fieldPath: metadata.namespace
                  path: namespace
        - name: data
          persistentVolumeClaim:
            claimName: iso-audit-portal-data
        - name: tmp
          emptyDir: {}
        - name: google-creds
          secret:
            secretName: iso-audit-portal-google
            optional: true
        - name: oauth2-cfg
          configMap:
            name: oauth2-proxy-cfg
