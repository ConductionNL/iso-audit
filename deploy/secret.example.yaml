---
# TEMPLATE — de echte Secrets worden out-of-band aangemaakt, nooit uit dit bestand.
# Argo beheert ze niet; `kustomization.yaml` neemt dit bestand niet op.
#
# WAAROM OUT-OF-BAND EN NIET EXTERNAL SECRETS (vastgesteld 2026-08-12, taak 4.1):
# ESO draait in dit cluster, maar de bestaande ClusterSecretStore
# (`nextcloud-shared-store`) bestaat om één seed-Secret naar véél tenant-namespaces
# te distribueren. iso-platform is één namespace — er is niets uit te delen. ESO zou
# hier een extra hop en een extra te auditen component toevoegen zonder dat er iets
# geheimer wordt. Out-of-band kubectl-Secrets, zoals openwoo-provisioner het ook
# doet, is de boring en uit te leggen keuze. Komt er ooit een echte vault (geen
# kubernetes-provider), dan is dát het moment om te herzien.
#
# Aanmaken:
#
#   # 1. oauth2-proxy — verplicht, anders start de sidecar niet
#   kubectl create secret generic iso-audit-portal-oauth -n iso-platform \
#     --from-literal=client-secret='<Keycloak-clientsecret van iso-audit-portal>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32)"
#
#   # 2. LLM-key — org-workspace-key, GEEN persoonlijke subscription-token.
#   #    Optioneel: zonder dit secret werkt triage/memo, maar geen classificatie.
#   kubectl create secret generic iso-audit-portal-llm -n iso-platform \
#     --from-literal=api-key='<org workspace API key>'
#
#   # 3. Google-service-account — komt met change gsuite-service-account-sources.
#   #    Optioneel: zonder dit melden de Drive/Planning-bronnen zich als
#   #    niet-gekoppeld in /config/health in plaats van de pod te laten crashen.
#   kubectl create secret generic iso-audit-portal-google -n iso-platform \
#     --from-file=service-account.json=<pad naar keyfile>
#
#   # 4. Bron-credentials — alle org-owned, nooit op naam van een persoon.
#   kubectl create secret generic iso-audit-portal-sources -n iso-platform \
#     --from-literal=jira-base-url='https://<org>.atlassian.net' \
#     --from-literal=jira-user-email='<functioneel account>' \
#     --from-literal=jira-api-token='<token van dat functionele account>' \
#     --from-literal=miro-api-token='<org-owned Miro-token>'
#
# Onderstaande manifests staan er alleen als vormvoorbeeld. Waarden zijn
# placeholders en moeten dat blijven.
apiVersion: v1
kind: Secret
metadata:
  name: iso-audit-portal-oauth
  namespace: iso-platform
type: Opaque
stringData:
  client-secret: "PLACEHOLDER-NIET-COMMITTEN"
  cookie-secret: "PLACEHOLDER-NIET-COMMITTEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: iso-audit-portal-sources
  namespace: iso-platform
type: Opaque
stringData:
  jira-base-url: "PLACEHOLDER-NIET-COMMITTEN"
  jira-user-email: "PLACEHOLDER-NIET-COMMITTEN"
  jira-api-token: "PLACEHOLDER-NIET-COMMITTEN"
  miro-api-token: "PLACEHOLDER-NIET-COMMITTEN"
---
# UI-configuratie van het portaal. Wat een auditor in het configuratiescherm invult,
# landt hier — mits `ISO_AUDIT_CONFIG_SECRET` gezet is; anders in JSON op de PVC.
#
# Eenmalig LEEG aanmaken; het portaal patcht daarna zijn eigen sleutel:
#   kubectl -n iso-platform create secret generic iso-audit-portal-config
#
# Het portaal mag dit Secret `get` en `patch`, en niets anders — zie rbac-config.yaml.
# Andere sleutels die een beheerder hier toevoegt, blijven staan: het portaal gebruikt
# een merge-patch op één sleutel.
apiVersion: v1
kind: Secret
metadata:
  name: iso-audit-portal-config
  namespace: iso-platform
type: Opaque
stringData:
  # Wordt door het portaal beheerd. Handmatig vullen is niet nodig en niet aan te raden.
  bron_config.json: "{}"
