---
# SA zonder token-automount. Sinds 2026-08-14 heeft de app WEL kube-API-toegang nodig
# (één Secret lezen en patchen voor UI-configuratie), maar automount zou de token in
# élke container van de pod zetten — ook in de oauth2-proxy-sidecar, die er niets te
# zoeken heeft. In plaats daarvan mount `deployment.yaml` een projected token alleen in
# de app-container, met een expiratie van een uur.
#
# Rechten: `rbac-config.yaml` — get+patch op precies één Secret-naam, geen list, geen
# ClusterRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iso-audit-portal
  namespace: iso-platform
automountServiceAccountToken: false
