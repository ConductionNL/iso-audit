---
# SA zonder token-automount: het portaal heeft geen kube-API-toegang nodig.
# Dit wijkt bewust af van openwoo-provisioner, dat de token wél mount om
# Argo-Application-status te lezen. Dat doet dit portaal niet, dus geen token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iso-audit-portal
  namespace: iso-platform
automountServiceAccountToken: false
