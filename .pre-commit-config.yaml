# Pre-commit configuratie voor iso-audit.
#
# Belangrijke design-keuze: alle hooks gebruiken --check / read-only varianten.
# We voeren NOOIT format-on-write of fix-on-write hooks uit. Reden: anders gaan
# CI en lokaal stil uit elkaar lopen — een ontwikkelaar commit, hook fixt
# stilletjes, push, en CI faalt op iets anders dan wat de auteur zag. Beter:
# expliciet `uv run ruff format` of `ruff check --fix` lokaal draaien wanneer
# de hook faalt. Hook is poortwachter, niet auto-correct.
#
# Gitleaks is een Go-binary, geen Python-package — daarom via pre-commit
# repository en niet via pyproject.toml.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff check
        args: [--no-fix]
      - id: ruff-format
        name: ruff format --check
        args: [--check]

  # Lokale hook i.p.v. mirrors-mypy (2026-08-12). De mirror draait mypy in een
  # geïsoleerde venv, en met `additional_dependencies: []` had die geen pydantic,
  # python-docx of de markdown-stubs. Deze hook faalde dus altijd op
  # `import-not-found` — nooit op een echt typefout. Wie pre-commit lokaal draaide,
  # zag een rode gate die niets zei, en de enige uitweg was hem negeren.
  #
  # `uv run` gebruikt de project-venv, dus dit is exact wat CI draait
  # (`uv run mypy --strict src`). Parity is hier het hele punt.
  # `pass_filenames: false` omdat --strict het hele pakket nodig heeft, niet losse
  # gewijzigde bestanden.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict src
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Twee dingen gerepareerd (2026-08-12), beide pre-existing:
        #
        #  1. `-r src` is weg. pre-commit plakt de gewijzigde bestanden achter de
        #     args, en `-r <dir>` samen met expliciete targets laat bandit afbreken
        #     met "unrecognized arguments". Deze hook faalde dus altijd, op elke
        #     commit — niet op bevindingen maar op een argumentfout. `files: ^src/`
        #     doet nu de scope-begrenzing, wat óók gelijk is aan wat CI scant.
        #  2. `--severity-level medium` erbij. Bandit geeft exitcode 1 bij élke
        #     bevinding; zonder drempel blokkeerden vier pre-existing low-meldingen
        #     alles.
        #
        # Houd deze args gelijk aan de bandit-stap in .github/workflows/ci.yml,
        # anders lopen CI en lokaal weer stil uit elkaar.
        args: [-c, pyproject.toml, --severity-level, medium]
        files: ^src/
        additional_dependencies: ["bandit[toml]"]
